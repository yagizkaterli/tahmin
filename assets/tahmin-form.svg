<svg xmlns="http://www.w3.org/2000/svg" width="640" height="240" viewBox="0 0 640 240" font-family="'Cascadia Code','Consolas',monospace">
  <rect width="640" height="240" rx="12" fill="#0E0D13"/>
  <rect x="0" y="0" width="640" height="34" rx="12" fill="#14131C"/>
  <circle cx="20" cy="17" r="5" fill="#F4645D"/>
  <circle cx="38" cy="17" r="5" fill="#F9BD4F"/>
  <circle cx="56" cy="17" r="5" fill="#3FC84F"/>
  <text x="320" y="22" text-anchor="middle" fill="#8B8798" font-size="12">tahmin — form</text>

  <g font-size="14">
    <text x="24" y="66" fill="#7FA8E0">TAHMIN</text>
    <text x="130" y="66" fill="#E9E7F0">rapor ilk denemede kapiyi gecer
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.08;0.12" dur="10s" repeatCount="indefinite"/>
    </text>

    <text x="24" y="94" fill="#7FA8E0">GUVEN</text>
    <text x="130" y="94" fill="#E8B562">orta
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.2;0.24" dur="10s" repeatCount="indefinite"/>
    </text>

    <text x="24" y="122" fill="#7FA8E0">DAYANAK</text>
    <text x="130" y="122" fill="#E9E7F0">son 5 benzer isin 4'u gecti
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.32;0.36" dur="10s" repeatCount="indefinite"/>
    </text>

    <text x="24" y="150" fill="#7FA8E0">YANLISLAR</text>
    <text x="130" y="150" fill="#D97777">kapi RED verirse curur
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.44;0.48" dur="10s" repeatCount="indefinite"/>
    </text>

    <text x="24" y="178" fill="#7FA8E0">ELENEN</text>
    <text x="130" y="178" fill="#8B8798">"is zaten yapildi" — kayitta var, tahmin degil
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.56;0.60" dur="10s" repeatCount="indefinite"/>
    </text>

    <text x="24" y="206" fill="#7FA8E0">PENCERE</text>
    <text x="130" y="206" fill="#E9E7F0">bu aksam, rapor dustugunde
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.68;0.72" dur="10s" repeatCount="indefinite"/>
    </text>
  </g>

  <text x="130" y="230" fill="#8FD6BD" font-size="12" opacity="0">
    isabet: TAM — deftere yazildi ✓
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.82;0.86;0.97;1" dur="10s" repeatCount="indefinite"/>
  </text>

  <rect x="112" y="52" width="8" height="16" fill="#CFC9E4">
    <animate attributeName="opacity" values="1;0" dur="1s" repeatCount="indefinite"/>
    <animate attributeName="y" values="52;80;108;136;164;192;192" keyTimes="0;0.12;0.24;0.36;0.48;0.60;1" dur="10s" repeatCount="indefinite"/>
  </rect>
</svg>
